name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  #CI
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        global-json-file: 'global.json'

    - name: Restore Dependencies
      run: dotnet restore RPBooking/RPBooking.sln

    - name: Build Solution
      run: dotnet build RPBooking/RPBooking.sln --no-restore

    - name: Run Tests
      run: dotnet test RPBooking/UnitTests/UnitTests.csproj --no-build --verbosity normal
  
  #CD
  publish-container:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./RPBooking/Dockerfile
          push: true
          tags: ghcr.io/frogplatinum/rpbooking-api:latest
